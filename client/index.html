  <style>
    :root{
      color-scheme:dark;
      --bg:#080d20;--panel:#111a34;--panel2:#172342;--line:#29365d;--text:#f5f4ff;--muted:#9ba6c7;
      --purple:#8957ff;--purple2:#6736e8;--bubble:#202b4b;--bubbleMine:#5630c8;--danger:#ff6b81;
      --radius:16px;--font:15px;--fontSize:15px;
    }
    html[data-theme="light"]{
      color-scheme:light;
      --bg:#eef1f8;--panel:#ffffff;--panel2:#f3f5fb;--line:#d7dcea;--text:#101528;--muted:#5d6780;
      --bubble:#ffffff;--bubbleMine:#d9c9ff;--purple:#7a45ff;--purple2:#5b2be0;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 12% 0,#29205b 0,transparent 42%),var(--bg);color:var(--text);font:var(--fontSize)/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    html[data-theme="light"] body{background:radial-gradient(ellipse at 12% 0,#dcd2ff 0,transparent 42%),var(--bg)}
    button,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:none}
    .hidden{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .avatar{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#bd91c9,#6955a8);font-weight:800;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}

    /* auth */
    .auth-screen{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;overflow:auto;background:radial-gradient(ellipse at 15% 0,#29205b 0,transparent 42%),var(--bg)}
    html[data-theme="light"] .auth-screen{background:radial-gradient(ellipse at 15% 0,#dcd2ff 0,transparent 42%),var(--bg)}
    .auth-card{width:min(100%,440px);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:25px;box-shadow:0 28px 80px #0008}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#65d7ff,#9255ff);font-size:25px;font-weight:900;box-shadow:0 8px 22px #8055ff55;color:#fff}.brand strong{font-size:24px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}
    h1{font-size:25px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
    .switch{display:flex;gap:4px;padding:4px;background:var(--panel2);border-radius:12px;margin:14px 0}
    .switch button{flex:1;padding:10px;border-radius:9px;background:transparent;color:var(--muted)}
    .switch button.active{background:#30245c;color:#ded5ff;font-weight:700}
    label{display:block;color:var(--muted);font-size:12px;margin:13px 0 6px}
    .field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);outline:none}
    .field:focus{border-color:var(--purple)}
    .primary{width:100%;padding:13px;border-radius:12px;margin-top:17px;background:linear-gradient(135deg,#a17cff,#6736e8);font-weight:750;color:#fff}
    .primary:disabled{opacity:.55;cursor:wait}
    .error{min-height:18px;margin-top:9px;color:#ff9aab;font-size:12px}
    .note{font-size:11px;color:var(--muted);line-height:1.5;margin:12px 0 0}

    /* app layout */
    .app{max-width:1280px;min-height:calc(100vh - 40px);margin:20px auto;display:grid;grid-template-columns:360px 1fr;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:0 25px 80px #0007}
    .side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:calc(100vh - 40px);background:var(--panel)}
    .side-head{padding:16px 16px 12px;display:flex;align-items:center;gap:11px}
    .side-head .logo{width:42px;height:42px;font-size:21px}
    .side-head strong{font-size:20px}
    .side-head small{display:block;font-size:9px;color:var(--muted);letter-spacing:1.5px}
    .side-head .icon-btn{margin-left:auto;width:38px;height:38px;border-radius:12px;background:var(--panel2);font-size:18px}
    .side-head .icon-btn + .icon-btn{margin-left:6px}

    .me{margin:0 14px 13px;padding:10px 12px;border-radius:15px;background:var(--panel2);display:flex;align-items:center;gap:10px;cursor:pointer}
    .me-info{min-width:0;flex:1}.me-info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .me-info small{color:var(--purple)}

    .search{margin:0 14px 10px}
    .search input{width:100%;padding:11px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--text);outline:none}

    .tabs{display:flex;gap:4px;padding:0 12px 10px}
    .tabs button{flex:1;padding:9px 3px;border-radius:9px;background:transparent;color:var(--muted);font-size:12px}
    .tabs button.active{background:#30245c;color:#d4c8ff}
